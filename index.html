<!-- Sky Window — weather app · front end -->

<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Sky Window — weather</title>

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <main class="app">
      <h1 class="title">Sky Window</h1>

      <form class="search" id="search" autocomplete="off">
        <input class="field" id="city" type="text" placeholder="Try: Vancouver" aria-label="City name">
        <button class="action" type="submit">Check</button>
      </form>

      <section class="card">
        <canvas id="sky"></canvas>

        <div class="readout" id="readout">
          <p class="place" id="place">Vancouver, CA</p>
          <p class="temp" id="temp">22<span>°C</span></p>
          <p class="condition" id="condition">Light rain</p>
          <div class="details">
            <div><b id="feels">20°C</b><span>feels like</span></div>
            <div><b id="humidity">78%</b><span>humidity</span></div>
            <div><b id="wind">14 km/h</b><span>wind</span></div>
          </div>
        </div>

        <p class="message hidden" id="message">Add your API key in app.js, then search a city.</p>
      </section>
   </main>

   <script type="module" src="app.js"></script>
</body>
</html>
